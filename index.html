<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover отдаёт нам области под вырезом и индикатором,
         иначе на iPhone снизу останется белая полоса вместо панели.
         maximum-scale здесь не ставим: он запрещает увеличение двумя пальцами,
         а это единственный способ прочитать мелкое для слабовидящего. Safari
         увеличивает страницу при фокусе на поле мельче 16px — поэтому поле
         поиска задано ровно в 16px, а не зум запрещён. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <meta name="description" content="Комбинации, шансы банка, эквити и префлоп-чарты. Считает на устройстве, без сети." />
    <!-- Полноэкранный режим после «На экран «Домой»» -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poker Bro" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Poker Bro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
